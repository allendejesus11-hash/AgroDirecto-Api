# Backend AgroDirecto. Copia .env.example a .env y coloca credenciales.
# En una instalacion con volumen PostgreSQL existente, usa la contraseña ORIGINAL.
services:
  app:
    image: docker-spring-boot-postgres:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrodirecto-api
    ports:
      - "8080:8088"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agrodirecto
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SEED_DEMO_DATA: "false"
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env}"

  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}"
      POSTGRES_DB: "${POSTGRES_DB:-agrodirecto}"
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Solamente se ejecutan al inicializar un VOLUMEN NUEVO y VACIO.
      - ./src/main/resources/db/agrodirecto_schema_postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/datos_prueba_postgresql_bcrypt.sql:/docker-entrypoint-initdb.d/02-datos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: "${POSTGRES_VOLUME_NAME:-agrodirecto_db_data}"

# Se usa la red existente donde ya esta conectado el contenedor PostgreSQL 'db'.
# Necesario cuando se recrea solamente la API con --no-deps en la EC2 existente.
# Para una instalacion nueva, primero crear esta red: docker network create agrodirecto_agrodirecto-network
networks:
  default:
    external: true
    name: "${DOCKER_NETWORK_NAME:-agrodirecto_agrodirecto-network}"
