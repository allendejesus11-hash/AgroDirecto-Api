spring.application.name=AgroDirectoAPI
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/agrodirecto
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgre}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:AgroDirectoJWTSecretKey2026-UPC-Proyecto-Backend-Seguridad}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.root=INFO
logging.file.name=logs/log_agrodirecto.log

# SOLO DESARROLLO: inserta datos de ejemplo cuando las 11 tablas estan completamente vacias.
# No borra ni sobreescribe datos existentes; para produccion usar SEED_DEMO_DATA=false.
app.seed-demo-data=${SEED_DEMO_DATA:false}
